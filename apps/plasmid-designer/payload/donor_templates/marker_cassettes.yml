# ============================================================================
# Selectable marker library for Plasmid Designer.
#
# Sequence fields (sequence_file, length_bp, md5, sequence_provenance,
# sequence_status) are GENERATED by tools/fetch_marker_sequences.R.
# Re-run that tool instead of hand-editing them.
#
# Drosophila cassettes are extracted from the local pJAT GenBank files;
# standard markers come from NCBI NuCCORE (accession recorded per marker).
# sequence_status: bundled = FASTA present | unavailable = could not obtain
# (never a placeholder sequence) | none = no marker by design.
# ============================================================================

version: 1.0.0
schema: marker_cassettes/1.0
notes: |
  Metadata-only marker library for the Plasmid Designer.  No nucleotide sequences are shipped in either app; sequences are supplied by the user (paste/upload) or fetched on demand from the cited source.  The app makes no network calls without an explicit button press and works fully offline by default.  A construct whose marker has sequence_provenance = "unset" exports with a blocking warning.
markers:
- id: 3xP3_dsRed
  label: 3xP3-DsRed (eye marker)
  category: drosophila
  description: |
    Strong eye-specific fluorescent marker driven by the 3xP3 promoter; commonly used as a visible transformation marker in Drosophila and removable with piggyBac/B3.
  selection: Visible marker (red eyes); no drug selection
  source: Stern et al. 2024; present in pJAT7, pJAT10, pJAT30
  sequence_status: bundled
  fetch_from: |
    Extract from pJAT30.gbk (Addgene 204294).  Coordinates are published in the project_documentation/atlanta_plasmid_register.md attR register; the marker cassette lies between attR4 and attR5.
  expected_features:
  - 3xP3 promoter
  - DsRed CDS
  - SV40 3'UTR
  sequence_provenance: pJAT local GenBank pJAT30.gbk bp=4749..6609 (attR4..attR5 payload)
  sequence_file: donor_templates/marker_sequences/3xP3_dsRed.fasta
  length_bp: 1861
  md5: c301bae186694b3345f9015efdb3c824
